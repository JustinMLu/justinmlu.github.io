    .headshot {
      display: block;
      width: 200px;
      max-width: 100%;
      height: auto;
      animation: headshot-spin 16s linear infinite;
    }

    @keyframes headshot-spin {
      from {
        transform: perspective(600px) rotateX(-10deg) rotateY(0turn);
      }
      to {
        transform: perspective(600px) rotateX(-10deg) rotateY(1turn);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .headshot {
        animation: none;
      }
    }

    a {
      color: #0080ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
